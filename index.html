    // =========================================================================
    // GLOBAL HEADER COMPONENT (Identical on every screen)
    // =========================================================================
    function GlobalHeader({ activeScreen, setScreen, isTvMode = false }) {
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

      if (isTvMode) {
        // Screen 8 (TV Display): Dark Navy background with logos on white rounded pill
        return (
          <header className="w-full bg-[#070D1E] border-b border-indigo-950 py-3.5 px-4 sm:px-8 flex items-center justify-between shadow-2xl">
            <div className="flex items-center gap-4 sm:gap-6">
              {/* White rounded pill containing the two official logos */}
              <div className="bg-white px-3.5 py-1.5 rounded-2xl flex items-center gap-3 shadow-lg border border-slate-200">
                <img 
                  src={LOGO_TEKNOKRAT} 
                  alt="Logo Universitas Teknokrat Indonesia" 
                  className="h-10 sm:h-12 w-auto object-contain"
                />
                <div className="h-7 w-[1px] bg-slate-200"></div>
                <img 
                  src={LOGO_PEMDA} 
                  alt="Logo Pemerintah Provinsi Lampung" 
                  className="h-10 sm:h-12 w-auto object-contain"
                />
              </div>

              <div>
                <div className="flex items-center gap-2">
                  <h1 className="text-xl sm:text-2xl font-black text-white tracking-tight">Antri-Pintar</h1>
                  <span className="px-2.5 py-0.5 rounded-full text-[10px] font-extrabold bg-[#14B8A6] text-slate-950">
                    TV CALL DISPLAY
                  </span>
                </div>
                <p className="text-xs text-indigo-200 font-medium hidden sm:block">
                  Sistem Pemanggilan Loket Pelayanan Terpadu Satu Pintu
                </p>
              </div>
            </div>

            <div className="flex items-center gap-4">
              <div className="text-right">
                <div className="text-xs font-bold text-teal-400 flex items-center justify-end gap-1.5">
                  <span className="w-2.5 h-2.5 rounded-full bg-teal-400 animate-ping"></span>
                  SERVER LIVE SINKRON
                </div>
                <div className="text-sm font-black text-white font-mono">10:42:15 WIB</div>
              </div>
            </div>
          </header>
        );
      }

      // Standard Global Header: Light/White background with soft bottom shadow
      return (
        <header className="sticky top-0 z-50 w-full bg-white/95 backdrop-blur-md border-b border-slate-200/90 shadow-sm">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div className="flex items-center justify-between h-18 sm:h-20">
              
              {/* LEFT: TWO REAL LOGOS SIDE BY SIDE */}
              <div className="flex items-center gap-3 sm:gap-4">
                <div className="flex items-center gap-2.5 sm:gap-3 bg-slate-50/90 p-1.5 sm:p-2 rounded-xl border border-slate-100">
                  {/* 1. Logo Universitas Teknokrat Indonesia */}
                  <img
                    src={LOGO_TEKNOKRAT}
                    alt="Logo Universitas Teknokrat Indonesia"
                    className="h-9 sm:h-12 w-auto object-contain transition-all"
                  />
                  <div className="h-6 sm:h-7 w-[1px] bg-slate-200"></div>
                  {/* 2. Logo Pemerintah Provinsi Lampung */}
                  <img
                    src={LOGO_PEMDA}
                    alt="Logo Pemerintah Provinsi Lampung"
                    className="h-9 sm:h-12 w-auto object-contain transition-all"
                  />
                </div>

                {/* System Name */}
                <div className="flex flex-col">
                  <div className="flex items-center gap-2">
                    <span 
                      onClick={() => setScreen(1)} 
                      className="text-lg sm:text-2xl font-black text-[#1E3A8A] tracking-tight cursor-pointer hover:opacity-90"
                    >
                      Antri-Pintar
                    </span>
                    <span className="flex h-2.5 w-2.5 relative">
                      <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-[#14B8A6] opacity-75"></span>
                      <span className="relative inline-flex rounded-full h-2.5 w-2.5 bg-[#14B8A6]"></span>
                    </span>
                  </div>
                  <span className="text-[10px] text-slate-500 font-medium hidden md:block">
                    Pemerintah Provinsi Lampung & Universitas Teknokrat Indonesia
                  </span>
                </div>
              </div>

              {/* CENTER / RIGHT: NAVIGATION & MASUK BUTTON */}
              <div className="hidden md:flex items-center gap-6">
                <nav className="flex items-center gap-6 text-sm font-bold text-slate-600">
                  <button 
                    onClick={() => setScreen(1)}
                    className={`transition-colors hover:text-[#1E3A8A] ${activeScreen === 1 ? 'text-[#1E3A8A] border-b-2 border-[#1E3A8A] pb-1' : ''}`}
                  >
                    Layanan
                  </button>
                  <button 
                    onClick={() => setScreen(5)}
                    className={`transition-colors hover:text-[#1E3A8A] ${activeScreen === 5 ? 'text-[#1E3A8A] border-b-2 border-[#1E3A8A] pb-1' : ''}`}
                  >
                    Tiket Saya
                  </button>
                  <button 
                    onClick={() => setScreen(6)}
                    className={`transition-colors hover:text-[#1E3A8A] ${activeScreen === 6 ? 'text-[#1E3A8A] border-b-2 border-[#1E3A8A] pb-1' : ''}`}
                  >
                    Status
                  </button>
                  <button 
                    onClick={() => alert('Pusat Bantuan Antri-Pintar 24 Jam: 1500-123 atau WhatsApp Halo Pemda 0811-7200-123')}
                    className="transition-colors hover:text-[#1E3A8A]"
                  >
                    Bantuan
                  </button>
                </nav>

                <div className="h-6 w-[1px] bg-slate-200"></div>

                <button 
                  onClick={() => setScreen(9)}
                  className="px-5 py-2.5 bg-[#1E3A8A] hover:bg-[#172554] text-white text-xs sm:text-sm font-extrabold rounded-xl transition shadow-sm flex items-center gap-2"
                >
                  <span>Masuk Petugas</span>
                  <span>→</span>
                </button>
              </div>

              {/* MOBILE HAMBURGER BUTTON */}
              <div className="flex md:hidden items-center gap-2">
                <button
                  onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
                  className="p-2.5 rounded-xl border border-slate-200 text-slate-700 hover:bg-slate-50 transition"
                  aria-label="Menu Navigasi"
                >
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    {mobileMenuOpen ? (
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M6 18L18 6M6 6l12 12" />
                    ) : (
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M4 6h16M4 12h16M4 18h16" />
                    )}
                  </svg>
                </button>
              </div>

            </div>

            {/* Mobile Dropdown Menu */}
            {mobileMenuOpen && (
              <div className="md:hidden py-4 border-t border-slate-100 flex flex-col gap-2.5 bg-white">
                <button 
                  onClick={() => { setScreen(1); setMobileMenuOpen(false); }}
                  className="px-4 py-2.5 text-left font-bold text-sm text-slate-700 hover:bg-slate-50 rounded-lg"
                >
                  🏢 Layanan Publik
                </button>
                <button 
                  onClick={() => { setScreen(5); setMobileMenuOpen(false); }}
                  className="px-4 py-2.5 text-left font-bold text-sm text-slate-700 hover:bg-slate-50 rounded-lg"
                >
                  🎫 Tiket Saya (Boarding Pass)
                </button>
                <button 
                  onClick={() => { setScreen(6); setMobileMenuOpen(false); }}
                  className="px-4 py-2.5 text-left font-bold text-sm text-slate-700 hover:bg-slate-50 rounded-lg"
                >
                  📱 Status Antrean Live
                </button>
                <button 
                  onClick={() => { setScreen(9); setMobileMenuOpen(false); }}
                  className="mx-3 mt-2 py-3 bg-[#1E3A8A] text-white text-center font-bold text-sm rounded-xl"
                >
                  Masuk Petugas Loket
                </button>
              </div>
            )}

          </div>
        </header>
      );
    }

    // =========================================================================
    // GLOBAL FOOTER COMPONENT (Identical on every screen)
    // =========================================================================
    function GlobalFooter() {
      return (
        <footer className="w-full bg-white border-t border-slate-200 mt-auto py-8">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center space-y-3">
            
            <div className="flex flex-wrap items-center justify-center gap-2.5 text-xs text-slate-500 font-medium">
              <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-50 text-emerald-800 font-bold border border-emerald-200">
                <span className="h-2 w-2 rounded-full bg-emerald-500 animate-pulse"></span>
                Infrastruktur Smart City Terhubung: 4 Instansi Pemda
              </span>
              <span className="text-slate-300">•</span>
              <span>WCAG 2.1 AA Compliant</span>
              <span className="text-slate-300">•</span>
              <span>Enkripsi Privasi UU PDP No. 27/2022</span>
            </div>

            {/* EXACT TEXT REQUIRED */}
            <p className="text-sm sm:text-base font-bold text-[#1E3A8A] select-none tracking-tight">
              Copyright©2026 by ALSYA MAULIA FADILLAH dan Dr. Erliyan Redy Susanto, M.Kom
            </p>

            <p className="text-xs text-slate-400">
              Kolaborasi Strategis Universitas Teknokrat Indonesia & Dinas Komunikasi, Informatika dan Statistik Provinsi Lampung
            </p>

          </div>
        </footer>
      );
    }

    // =========================================================================
    // SCREEN SWITCHER FLOATING BAR (For instant navigation of all 11 screens)
    // =========================================================================
    function ScreenSwitcherBar({ activeScreen, setScreen }) {
      const screens = [
        { id: 1, label: "1. Beranda", tag: "Warga" },
        { id: 2, label: "2. Detail KTP", tag: "Warga" },
        { id: 3, label: "3. Pilih Jadwal", tag: "Warga" },
        { id: 4, label: "4. OTP & PDP", tag: "Warga" },
        { id: 5, label: "5. Tiket Pass", tag: "Warga" },
        { id: 6, label: "6. Status Live", tag: "Warga" },
        { id: 7, label: "7. Kiosk Tablet", tag: "Lokasi" },
        { id: 8, label: "8. TV Display", tag: "Lokasi" },
        { id: 9, label: "9. Konsol Petugas", tag: "Staff" },
        { id: 10, label: "10. Dasbor Unit", tag: "Pimpinan" },
        { id: 11, label: "11. Konfigurasi", tag: "Admin" },
      ];

      return (
        <div className="sticky bottom-0 z-40 bg-slate-900/95 backdrop-blur-md border-t border-slate-700 text-white px-3 py-2 shadow-2xl">
          <div className="max-w-7xl mx-auto flex items-center justify-between gap-3 overflow-x-auto">
            <div className="flex items-center gap-1 text-[11px] font-extrabold uppercase tracking-wider text-teal-400 whitespace-nowrap">
              <span>Navigasi Layar (11 Screens):</span>
            </div>
            
            <div className="flex items-center gap-1.5 overflow-x-auto pb-1">
              {screens.map((s) => (

      const [otp, setOtp] = useState(["5", "8", "2", "9", "1", ""]);
      const [countdown, setCountdown] = useState(48);
      const [consent, setConsent] = useState(false); // UNCHECKED BY DEFAULT per PRD

      useEffect(() => {
        if (countdown > 0) {
          const t = setTimeout(() => setCountdown(countdown - 1), 1000);
          return () => clearTimeout(t);
        }
      }, [countdown]);

      const handleOtpChange = (val, idx) => {
        if (val.length > 1) val = val[val.length - 1];
        const newOtp = [...otp];
        newOtp[idx] = val;
        setOtp(newOtp);
      };

      const isOtpFilled = otp.every(x => x !== "");
      const canProceed = isOtpFilled && consent;

      return (
        <div className="max-w-2xl mx-auto space-y-6 pb-20">

              <p className="text-xs text-slate-500 max-w-sm mx-auto">

                <span className="text-[10px] uppercase font-bold text-slate-400 block">Nomor WhatsApp Warga</span>

                </div>
              </div>
              <button 
                onClick={() => alert('Fitur ubah nomor aktif')}
                className="text-xs font-extrabold text-[#1E3A8A] hover:underline"

                Ubah
              </button>
            </div>

            {/* 6-BOX OTP INPUT */}

              <label className="block text-center text-xs font-bold text-slate-700">Masukkan 6 Digit OTP:</label>
              <div className="flex items-center justify-center gap-2 sm:gap-3">
                {otp.map((digit, idx) => (
                  <input
                    key={idx}
                    type="text"
                    inputMode="numeric"
                    maxLength={1}
                    value={digit}
                    onChange={(e) => handleOtpChange(e.target.value, idx)}
                    className="w-11 h-13 sm:w-13 sm:h-14 text-center text-xl font-black text-[#1E3A8A] rounded-xl border-2 border-slate-200 focus:border-[#1E3A8A] focus:outline-none bg-white shadow-xs"

                    <td className="py-2.5 font-bold">Rahmat Hidayat</td>
                    <td className="py-2.5 text-slate-600">Loket 3 Dukcapil</td>
                    <td className="py-2.5"><span className="px-2 py-0.5 rounded font-bold bg-slate-100 text-slate-700">Petugas Loket</span></td>
                    <td className="py-2.5 text-emerald-600 font-bold">● Aktif</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>

        </div>
      );
    }

    // =========================================================================
    // MAIN APP ROOT CONTROLLER
    // =========================================================================
    function App() {
      const [activeScreen, setActiveScreen] = useState(1);

      return (
        <div className="min-h-screen flex flex-col justify-between">
          
          {/* 1. Global Header (With real attached logos on all 11 screens) */}
          <GlobalHeader 
            activeScreen={activeScreen} 
            setScreen={setActiveScreen} 
            isTvMode={activeScreen === 8}
          />

          {/* 2. Dynamic Screen View */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
            {activeScreen === 1 && <Screen1Home setScreen={setActiveScreen} />}
            {activeScreen === 2 && <Screen2Detail setScreen={setActiveScreen} />}
            {activeScreen === 3 && <Screen3Schedule setScreen={setActiveScreen} />}
            {activeScreen === 4 && <Screen4Verification setScreen={setActiveScreen} />}
            {activeScreen === 5 && <Screen5Ticket setScreen={setActiveScreen} />}
            {activeScreen === 6 && <Screen6LiveStatus setScreen={setActiveScreen} />}
            {activeScreen === 7 && <Screen7Kiosk setScreen={setActiveScreen} />}
            {activeScreen === 8 && <Screen8TvDisplay />}
            {activeScreen === 9 && <Screen9Officer />}
            {activeScreen === 10 && <Screen10Dashboard />}
            {activeScreen === 11 && <Screen11Admin />}
          </main>

          {/* 3. Global Footer (Exact copyright text on all 11 screens) */}
          <GlobalFooter />

          {/* 4. Interactive Screen Switcher Bar */}
          <ScreenSwitcherBar activeScreen={activeScreen} setScreen={setActiveScreen} />

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
